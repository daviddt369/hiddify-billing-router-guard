# Install as /etc/systemd/system/hiddify-dr-backup.service.d/marker.conf (a drop-in: the main unit stays untouched).
# After a SUCCESSFUL twice-a-week snapshot the marker is touched; vpn-watch alerts when it gets old (limit 110 h: Thu 03:00 -> Mon 03:00 is 96 h + a reserve).
[Service]
StateDirectory=vpn-backup
StateDirectoryMode=0700
ExecStartPost=/usr/bin/touch /var/lib/vpn-backup/dr-snapshot.ok
