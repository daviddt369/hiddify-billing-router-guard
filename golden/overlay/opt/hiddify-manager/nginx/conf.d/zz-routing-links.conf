# routing-links: static landing for the VPN setup / routing import page.
# Custom (NOT generated by Hiddify, no .j2 twin) -> survives install.sh / apply_configs.
# A separate name-based server on the same unix socket as Hiddify's server `_` (conf.d/xray-base.conf);
# HAProxy already routes unknown hosts to this socket, nginx picks this block by Host.
#
# !! FILE NAME MATTERS: nginx sends requests with an unknown Host to the FIRST server block that listens
# !! on the socket. This file MUST sort after xray-base.conf (hence the "zz-" prefix) so Hiddify's block
# !! stays the default one. (A first attempt named routing-links.conf hijacked every other domain.)
# routing-links-cert.timer additionally runs guard_check() and disables this file if that ever happens.
# Rollback: delete this file, `nginx -t`, `systemctl reload hiddify-nginx`.

# 1 when the original client connection came in on port 80 (PROXY protocol keeps the dst port).
map $proxy_protocol_server_port $routing_links_plain {
    default 0;
    80      1;
}

server {
    listen unix:/opt/hiddify-manager/nginx/run/h2.sock proxy_protocol;
    http2 on;
    set_real_ip_from unix:;
    real_ip_header proxy_protocol;
    server_name @@ROUTING_HOST@@;

    root /var/lib/routing-links/www;
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    # ACME http-01 (acme.sh webroot shared with Hiddify). Plain HTTP must stay reachable here.
    location ^~ /.well-known/acme-challenge/ {
        root /opt/hiddify-manager/acme.sh/www;
        default_type text/plain;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Landing: / and the short links used by the Telegram bot.
    location ~ ^/(?:happ|incy|hiddify)?/?$ {
        if ($routing_links_plain) { return 301 https://$host$request_uri; }
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
