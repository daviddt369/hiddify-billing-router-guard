[Service]
ExecStartPost=/bin/sh -c 'install -d -o root -g root -m 755 /opt/hiddify-manager/log/system; if [ ! -e /opt/hiddify-manager/log/system/xray.access.log ]; then install -o root -g hiddify-panel -m 0640 /dev/null /opt/hiddify-manager/log/system/xray.access.log; else chown root:hiddify-panel /opt/hiddify-manager/log/system/xray.access.log; chmod 0640 /opt/hiddify-manager/log/system/xray.access.log; fi; if [ ! -e /opt/hiddify-manager/log/system/xray.access.state.json ]; then install -o hiddify-panel -g hiddify-panel -m 0664 /dev/null /opt/hiddify-manager/log/system/xray.access.state.json; else chown hiddify-panel:hiddify-panel /opt/hiddify-manager/log/system/xray.access.state.json; chmod 0664 /opt/hiddify-manager/log/system/xray.access.state.json; fi'
